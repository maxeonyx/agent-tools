name: Trusted test-status ledger

on:
  workflow_dispatch:
    inputs:
      target:
        description: Pull request number to record, or main to record main itself
        required: true
        type: string

permissions: {}

concurrency:
  group: ledger-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head_ref: ${{ steps.target.outputs.head_ref }}
      head_sha: ${{ steps.target.outputs.head_sha }}
    steps:
      # Dispatch decides which workflow definition runs, so a branch could
      # otherwise validate its own ledger with its own rules.
      - name: Require the workflow definition that main controls
        run: test "$GITHUB_REF" = refs/heads/main

      - name: Resolve the dispatch target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET: ${{ inputs.target }}
        run: |
          case "$TARGET" in
            main)
              head_ref=main
              head_sha=$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq .object.sha)
              ;;
            '' | *[!0-9]*)
              echo "target must be a pull request number or main, got '$TARGET'"
              exit 1
              ;;
            *)
              test "$(gh pr view "$TARGET" --repo "$REPOSITORY" --json state --jq .state)" = OPEN
              test "$(gh pr view "$TARGET" --repo "$REPOSITORY" --json isCrossRepository --jq .isCrossRepository)" = false
              head_ref=$(gh pr view "$TARGET" --repo "$REPOSITORY" --json headRefName --jq .headRefName)
              head_sha=$(gh pr view "$TARGET" --repo "$REPOSITORY" --json headRefOid --jq .headRefOid)
              ;;
          esac
          echo "head_ref=$head_ref" >>"$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >>"$GITHUB_OUTPUT"

      - name: Check out the reviewed ratchet source
        uses: actions/checkout@v6
        with:
          repository: maxeonyx/tdd-ratchet-rs
          ref: v1.1.6
          path: trusted-ratchet-source
          persist-credentials: false

      - name: Check out the recorded head without credentials
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.target.outputs.head_sha }}
          fetch-depth: 0
          path: pull-request
          submodules: recursive
          persist-credentials: false

      # The write job judges the proposed ledger against the committed one, so
      # the committed one has to be a ledger this workflow wrote.
      - name: Reject ordinary ledger edits
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        working-directory: pull-request
        run: |
          commit=$(git rev-list -1 HEAD -- .test-status.json)
          changed=$(git diff-tree --no-commit-id --name-only -r "$commit")
          test "$changed" = '.test-status.json'
          test "$(gh api "repos/$REPOSITORY/commits/$commit" --jq '.commit.verification.verified')" = true
          test "$(gh api "repos/$REPOSITORY/commits/$commit" --jq '.author.login')" = 'github-actions[bot]'
          test "$(gh api "repos/$REPOSITORY/commits/$commit" --jq '.committer.login')" = 'web-flow'

      - uses: dtolnay/rust-toolchain@stable

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Install Nix
        uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31

      - name: Use the devenv binary cache
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv

      - name: Install the workspace's exact devenv
        run: nix profile install github:cachix/devenv/v1.4.1

      - name: Build the base-controlled ratchet
        run: cargo build --release --manifest-path trusted-ratchet-source/Cargo.toml

      - name: Make nested public repositories credential-free
        working-directory: pull-request
        run: |
          # shellcheck disable=SC2016
          git submodule foreach --recursive '
            origin=$(git remote get-url origin)
            https_url=$(printf %s "$origin" | sed "s#^git@github.com:#https://github.com/#")
            git remote set-url origin "$https_url"
          '

      - name: Produce the proposed ledger
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: pull-request
        run: devenv shell -- ../trusted-ratchet-source/target/release/cargo-ratchet

      - name: Upload only the proposed ledger
        uses: actions/upload-artifact@v7
        with:
          name: proposed-test-status
          path: pull-request/.test-status.json
          if-no-files-found: error
          include-hidden-files: true

  write:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the ratchet-produced ledger
        uses: actions/download-artifact@v8
        with:
          name: proposed-test-status
          path: ledger-output

      - name: Validate and commit only the ledger
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ needs.validate.outputs.head_ref }}
          HEAD_SHA: ${{ needs.validate.outputs.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          ledger='ledger-output/.test-status.json'
          test -f "$ledger"
          test "$(find ledger-output -type f | wc -l)" -eq 1
          jq -e '
            (keys - ["\u0024schema", "tests", "checks", "renames"] | length) == 0 and
            (.tests | type == "object") and
            (all(.tests[]; . == "pending" or . == "passing")) and
            (has("removals") | not) and
            (has("baseline") | not)
          ' "$ledger" >/dev/null

          current_head=$(gh api "repos/$REPOSITORY/git/ref/heads/$HEAD_REF" --jq .object.sha)
          test "$current_head" = "$HEAD_SHA"

          gh api "repos/$REPOSITORY/contents/.test-status.json?ref=$HEAD_SHA" --jq .content \
            | tr -d '\n' | base64 --decode >previous-ledger.json
          if ! gh api "repos/$REPOSITORY/contents/.tdd-ratchet.json?ref=$HEAD_SHA" --jq .content \
            | tr -d '\n' | base64 --decode >instructions.json; then
            echo '{}' >instructions.json
          fi

          # A commit here moves the head, which invalidates any status recorded
          # against it, so record nothing when there is nothing to record.
          if diff <(jq -S . previous-ledger.json) <(jq -S . "$ledger") >/dev/null; then
            echo 'The committed ledger already matches the ratchet result.'
            exit 0
          fi

          # Re-establish the semantic ledger transition in the privileged job.
          # The artifact was produced while untrusted pull-request code ran, so
          # JSON shape alone is not a trust boundary.
          jq -e --slurpfile previous previous-ledger.json \
            --slurpfile instructions instructions.json '
            . as $next
            | $previous[0] as $old
            | $instructions[0] as $cfg
            | ($cfg.renames // {}) as $renames
            | ($cfg.removals // []) as $removals
            | def transition_ok($from; $to):
                ($from == "pending" and ($to == "pending" or $to == "passing"))
                or ($from == "passing" and $to == "passing");
              def renamed_to($old_name):
                [$renames | to_entries[] | select(.value == $old_name) | .key];
              (($cfg | keys - ["renames", "removals"] | length) == 0)
            and (($renames | type) == "object")
            and (($removals | type) == "array")
            and (($next.renames // {}) == $renames)
            and all($old.tests | to_entries[];
              . as $entry
              | if (($next.tests | has($entry.key)) and
                    $entry.value == "passing" and
                    $next.tests[$entry.key] == "pending")
                then error("passing tests cannot be downgraded")
                elif ($next.tests | has($entry.key))
                then transition_ok($entry.value; $next.tests[$entry.key])
                elif (renamed_to($entry.key) | length) == 1
                then (renamed_to($entry.key)[0]) as $new_name
                  | ($next.tests | has($new_name))
                  and transition_ok($entry.value; $next.tests[$new_name])
                elif ($removals | index($entry.key)) != null
                then true
                else error("removed tests require an instruction")
                end)
            and all($next.tests | to_entries[];
              . as $entry
              | if ($old.tests | has($entry.key))
                then transition_ok($old.tests[$entry.key]; $entry.value)
                elif ($renames | has($entry.key))
                then ($renames[$entry.key]) as $old_name
                  | ($old.tests | has($old_name))
                  and transition_ok($old.tests[$old_name]; $entry.value)
                elif $entry.value == "pending" or ($entry.key | endswith("tdd_ratchet_gatekeeper"))
                then true
                else error("new tests must enter pending")
                end)
            and all($removals[];
              . as $removed
              | ($old.tests | has($removed))
              and ($next.tests | has($removed) | not)
              and ([ $renames[] ] | index($removed) | not))
          ' "$ledger" >/dev/null

          content=$(base64 -w0 "$ledger")
          blob_sha=$(gh api -X POST "repos/$REPOSITORY/git/blobs" \
            -f content="$content" -f encoding=base64 --jq .sha)
          head_tree=$(gh api "repos/$REPOSITORY/git/commits/$HEAD_SHA" --jq .tree.sha)
          tree_sha=$(jq -n --arg base "$head_tree" --arg blob "$blob_sha" '{
            base_tree: $base,
            tree: [{path: ".test-status.json", mode: "100644", type: "blob", sha: $blob}]
          }' | gh api -X POST "repos/$REPOSITORY/git/trees" --input - --jq .sha)
          commit_sha=$(jq -n --arg tree "$tree_sha" --arg head_sha "$HEAD_SHA" '{
            message: "chore: record tdd-ratchet status [skip ci]",
            tree: $tree,
            parents: [$head_sha]
          }' | gh api -X POST "repos/$REPOSITORY/git/commits" --input - --jq .sha)
          gh api -X PATCH "repos/$REPOSITORY/git/refs/heads/$HEAD_REF" \
            -f sha="$commit_sha" -F force=false >/dev/null
